version: 2

models:
  - name: stg_customers
    description: Cleaned and renamed customer records.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: full_name
        description: Concatenated first and last name.
      - name: email
        data_tests: [unique, not_null]
      - name: country
        data_tests: [not_null]
      - name: created_at
        data_tests: [not_null]

  - name: stg_products
    description: Cleaned product catalog with price in dollars.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price_usd
        description: Price converted from cents to dollars.

  - name: stg_orders
    description: Cleaned order records with status filtering.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'returned', 'pending', 'cancelled']

  - name: stg_reviews
    description: Cleaned product review records.
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: order_id
        data_tests: [not_null]
      - name: rating
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
      - name: review_date
        data_tests: [not_null]
